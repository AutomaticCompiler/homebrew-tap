name: Delete branches from merged PRs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged PR branches
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;

            const { data: repository } = await github.rest.repos.get({
              owner,
              repo,
            });

            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "closed",
              per_page: 100,
            });

            const processedBranches = new Set();

            for (const pr of prs) {
              if (!pr.merged_at) continue;

              // Only delete branches in this repository, not branches in forks.
              if (pr.head.repo?.full_name !== `${owner}/${repo}`) continue;

              const branch = pr.head.ref;

              // Never delete a PR's base branch or the repository's default branch.
              if (branch === pr.base.ref || branch === repository.default_branch) continue;

              // A branch may be associated with more than one merged PR.
              if (processedBranches.has(branch)) continue;
              processedBranches.add(branch);

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`,
                });
                core.info(`Deleted "${branch}" (PR #${pr.number})`);
              } catch (error) {
                const message = error.response?.data?.message ?? error.message;

                if (
                  error.status === 404 ||
                  (error.status === 422 && message === "Reference does not exist")
                ) {
                  core.info(`"${branch}" is already gone (PR #${pr.number})`);
                } else {
                  throw error;
                }
              }
            }
